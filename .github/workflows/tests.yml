name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 8 — PHP 8.1
          - php: "8.1"
            laravel: "8.*"
            testbench: "^6.0"

          # Laravel 9 — PHP 8.1, 8.2
          - php: "8.1"
            laravel: "9.*"
            testbench: "^7.0"
          - php: "8.2"
            laravel: "9.*"
            testbench: "^7.0"

          # Laravel 10 — PHP 8.1, 8.2, 8.3, 8.4
          - php: "8.1"
            laravel: "10.*"
            testbench: "^8.0"
          - php: "8.2"
            laravel: "10.*"
            testbench: "^8.0"
          - php: "8.3"
            laravel: "10.*"
            testbench: "^8.0"
          - php: "8.4"
            laravel: "10.*"
            testbench: "^8.0"

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --colors=always
